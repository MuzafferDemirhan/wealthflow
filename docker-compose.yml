services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mssql+pyodbc://sa:WealthFlow_2024!@mssql:1433/wealthflow?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=true
    env_file:
      - ./backend/.env
    depends_on:
      mssql:
        condition: service_healthy
      mssql_init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: curl -f http://localhost:8000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  celery_worker:
    build: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mssql+pyodbc://sa:WealthFlow_2024!@mssql:1433/wealthflow?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=false
    depends_on:
      mssql_init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped

  celery_beat:
    build: ./backend
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mssql+pyodbc://sa:WealthFlow_2024!@mssql:1433/wealthflow?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=false
    depends_on:
      mssql_init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "WealthFlow_2024!"
      MSSQL_PID: "Developer"  # Free Developer Edition
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "WealthFlow_2024!" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mssql_init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "WealthFlow_2024!"
    command: >
      /opt/mssql-tools18/bin/sqlcmd
      -S mssql -U sa -P "WealthFlow_2024!" -No
      -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name='wealthflow') CREATE DATABASE wealthflow;"
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # SQL Server Management Studio alternative — Azure Data Studio via web
  # Use SSMS on Windows connecting to localhost:1433 with sa / WealthFlow_2024!

volumes:
  mssql_data:
